<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Meridian">
  <!-- Near-black ink field + slate hairline frame; filled globe+meridian for 16px tabs -->
  <rect width="32" height="32" rx="6" fill="#0c0e12"/>
  <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="5" fill="none" stroke="#464e5a" stroke-width="1.5"/>
  <!-- Steel-paper globe (filled) -->
  <circle cx="16" cy="16" r="10.25" fill="#c6ccd4" stroke="#8a929c" stroke-width="0.75"/>
  <!-- Dark meridian (vertical great circle) -->
  <path d="M16 5.75 C11.2 8.2 11.2 23.8 16 26.25 C20.8 23.8 20.8 8.2 16 5.75 Z"
        fill="#0c0e12" fill-opacity="0.92"/>
  <path d="M16 5.75 C11.2 8.2 11.2 23.8 16 26.25 C20.8 23.8 20.8 8.2 16 5.75 Z"
        fill="none" stroke="#0c0e12" stroke-width="1.25"/>
  <!-- Equator hairline -->
  <ellipse cx="16" cy="16" rx="10.25" ry="3.6" fill="none" stroke="#5c6570" stroke-width="1"/>
  <!-- Vertical axis -->
  <line x1="16" y1="5.75" x2="16" y2="26.25" stroke="#0c0e12" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Copper seal dot (desk accent) -->
  <circle cx="16" cy="16" r="2.1" fill="#b0683e"/>
</svg>
